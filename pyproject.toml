## Build system configurations
[build-system]
requires = ["setuptools>=80.0", "setuptools-scm>=9.0", "wheel"]
build-backend = "setuptools.build_meta"

## Blender-specific configurations
[tool.blender]
version = "4.5.3" # NOTE: When updating, the bpy version below may need to be changed as well
install-dir = "~/Applications/blender/"

## Project configurations
[project]
name = "anima"
dynamic = ["version"]
dependencies = [ 
   "bpy==4.5.3", # NOTE: See `pip index versions bpy` for versions and match with tool.blender.version
   "mathutils==3.3.0",
   "numpy==1.26.4",
   "scipy==1.15.3",
   "pytest==8.4.0",
   "plastex==3.1",
   "dill==0.4.0",
   "loguru==0.7.3",
   "svgpathtools>=1.7.1",
]
requires-python = ">=3.11.4,<=3.11.13" # Ensure compatibility with Blender's Python version
description = "Anima is a Python framework for Blender focused on mathematical visualizations, procedural animations, and educational content."
readme = "README.md"
authors = [
   { name = "8bit-euclid", email = "8bit.euclid@gmail.com" },
]
license = "GPL-3.0"
urls = { homepage = "https://github.com/8bit-euclid/Anima" }

## Development dependencies
[project.optional-dependencies]
dev = [
   "black>=23.0.0",
   "isort>=5.12.0",
   "pylint>=2.17.0",
]

## Setuptools configurations
[tool.setuptools]
packages.find.where = ["src"]
package-dir = { "" = "src" }

## Versioning configurations
[tool.setuptools_scm]
version_scheme = "guess-next-dev"
local_scheme = "no-local-version"
git_describe_command = [ "git", "describe", "--tags", "--match", "v*", "--first-parent"]

## Testing configurations
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = [
    "--ignore=tests/visual_tests/",
]

## Formatter and linter configurations
[tool.black]
line-length = 120
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 120
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
